[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
# Miden dependencies (from workspace)
miden = { workspace = true }
cargo-miden = { git = "https://github.com/0xMiden/compiler", branch = "next" }
miden-client = { version = "0.12", features = ["tonic", "testing"] }
miden-client-sqlite-store = { version = "0.12", package = "miden-client-sqlite-store" }
miden-objects = { version = "0.12", default-features = false, features = ["testing"] }
miden-core = { version = "0.19" }
miden-lib = { version = "0.12" }
miden-mast-package = { version = "0.19", default-features = false }

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
rand = { version = "0.9" }
hex = "0.4"

# Integration helpers (local dependency)
integration = { path = "../integration" }
